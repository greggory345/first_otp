<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <title>OTP</title>
    <link rel="stylesheet" href="otp.css">
</head>
<body>
    <main class="container">
        <div class="otp">
           <p>
                Enter OTP
           </p> 
        </div>
        <section class="code">
            <p>
                We've sent a verification code to your device
            </p>
        </section>
        <div class="otp_wrapper">
            <input type="text" id="otp-1" maxlength="1" class="otp_output" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code">
            <input type="text" id="otp-2" maxlength="1" class="otp_output" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <input type="text" id="otp-3" maxlength="1" class="otp_output" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <input type="text" id="otp-4" maxlength="1" class="otp_output" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <input type="text" id="otp-5" maxlength="1" class="otp_output" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            <input type="text" id="otp-6" maxlength="1" class="otp_output" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        </div>
        <!-- <div class="status_message" id="status_message"></div> -->
        <button id="verify_btn">
            Verify OTP
        </button>
    </main>
    <script src="otp.js"></script>
</body>
</html>
